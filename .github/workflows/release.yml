name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Automated Test Suite
        run: npm test

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Build Application Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            npm run build:mac
          elif [ "${{ runner.os }}" = "Windows" ]; then
            npm run build:win
          else
            npm run build:linux
          fi
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 2

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Platform Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist/
          merge-multiple: true

      - name: Determine Release Title
        id: release_title
        run: |
          TAG="${{ github.ref_name }}"
          RAW_HEADER=$(head -n 1 RELEASE_NOTES.md | sed -E 's/^#+[[:space:]]*//' | sed -E 's/^[🔥⚡✨🎉 ]+//' | xargs)
          if [[ "$RAW_HEADER" == "$TAG - "* ]]; then
            TITLE="$RAW_HEADER"
          elif [[ "$RAW_HEADER" == *" - "* ]]; then
            SUBTITLE="${RAW_HEADER#* - }"
            TITLE="$TAG - $SUBTITLE"
          elif [ -n "$RAW_HEADER" ]; then
            TITLE="$TAG - $RAW_HEADER"
          else
            TITLE="$TAG - Update"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Publish Single Clean Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          body_path: RELEASE_NOTES.md
          name: ${{ steps.release_title.outputs.title }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
